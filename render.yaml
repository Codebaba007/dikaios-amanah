# Render Blueprint — Dikaios Amanah API
#
# Deploy with: Render Dashboard → New → Blueprint → select the repository.
# Values marked `sync: false` are secrets and must be entered in the dashboard;
# they are never stored in Git.
services:
  - type: web
    name: dikaios-amanah-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Pooled Neon connection string (hostname contains "-pooler").
      # Migrations are run separately with the unpooled connection string.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      # The deployed frontend origin, e.g. https://dikaios-amanah.vercel.app
      - key: FRONTEND_URL
        sync: false
      - key: STORAGE_DRIVER
        value: local
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
