# Render Blueprint — Dikaios Amanah
#
# Deploy with: Render Dashboard → New → Blueprint → select the repository and
# the `development/stabilization` branch.
#
# Secrets marked `sync: false` are entered once in the dashboard and never
# stored in Git. JWT_SECRET is generated by Render and kept encrypted.
services:
  # ---------------------------------------------------------------- API ----
  - type: web
    name: dikaios-amanah-api
    runtime: node
    plan: free
    region: singapore
    branch: development/stabilization
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Pooled Neon connection string (hostname contains "-pooler").
      # Migrations are run separately with the unpooled connection string.
      - key: DATABASE_URL
        sync: false
      # Generated once by Render and kept encrypted. Stable across deploys, so
      # previously issued tokens keep working.
      - key: JWT_SECRET
        generateValue: true
      # Browser origin allowed by CORS.
      - key: FRONTEND_URL
        value: https://dikaios-amanah-web.onrender.com
      # `local` writes uploads to the container filesystem, which is wiped on
      # every deploy. Set to `s3` and fill in the S3_* values for durability.
      - key: STORAGE_DRIVER
        value: local
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

  # ----------------------------------------------------------- Frontend ----
  # Static sites are `type: web` with `runtime: static`; they have no compute
  # plan and are served from a global CDN, so `plan`/`region` do not apply.
  - type: web
    name: dikaios-amanah-web
    runtime: static
    branch: development/stabilization
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      # Inlined by Vite at build time; changing it requires a rebuild.
      - key: VITE_API_URL
        value: https://dikaios-amanah-api.onrender.com
    routes:
      # Single-page app: deep links such as /login resolve to index.html so a
      # hard refresh does not 404.
      - type: rewrite
        source: /*
        destination: /index.html
