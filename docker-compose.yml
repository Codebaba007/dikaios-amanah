# Dikaios Amanah — local development stack
#
#   docker compose up -d db backend      # database + API only
#   docker compose up -d                 # database + API + frontend (5173)
#
# The database port is published on 5433 because a native PostgreSQL service
# commonly occupies 5432 on Windows. Change DB_PORT if 5433 is also taken.
#
# This stack is for local development only. The hosted deployment uses Neon
# (database), Render (API) and Vercel (frontend) — it does not depend on this
# machine running.

services:
  db:
    image: postgres:15-alpine
    container_name: dikaios_amanah_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-dikaios_amanah}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-dikaios_amanah}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: dikaios_amanah_api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-dikaios_amanah}?schema=public
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      PORT: 5000
      NODE_ENV: production
      FRONTEND_URL: http://localhost:5173
      STORAGE_DRIVER: local
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: dikaios_amanah_web
    environment:
      VITE_API_URL: http://localhost:5000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
